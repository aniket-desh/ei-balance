[project]
name = "ei-cavity"
version = "0.1.0"
description = "Conditional cavity theory for balanced excitatory-inhibitory rate networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2", "scipy>=1.15", "matplotlib>=3.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
