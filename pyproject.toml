[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ei-cavity"
version = "0.1.0"
description = "Conditional cavity theory for heterogeneous neuronal operating points in balanced E–I networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "psutil>=5.9",
    "threadpoolctl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
