<h2>Overview</h2>
<figure><img src='overview.png' alt='overview'><figcaption><code>overview.pdf</code><br>Conditional theory against 1,694 simulated networks, one page. (a) Each neuron&#x27;s rate variance against its mean input at Bernoulli dispersion (dots; eight networks) with the conditional law (lines). (b) Dimension per neuron against degree dispersion, N = 2,000, with the conditional prediction and the two premature-averaging approximations. (c) Relative error of D/N against inverse square root of network size at five settings, N = 500 to 16,000 (medians with bootstrap standard errors). (d) Total E dimension per network neuron against excitatory fraction. (e) Squared covariance per distinct E-E and I-I pair against excitatory fraction. (f) Equal-lag pair moment against lag for E-E, E-I and I-I pairs. Lines are parameter-only predictions; markers are across-network means with one standard error.</figcaption></figure>
<h2>Degree dispersion</h2>
<figure><img src='degree_dimension.png' alt='degree_dimension'><figcaption><code>degree_dimension.pdf</code><br>Degree dispersion lowers activity dimension along the conditional prediction. (a) Joint dimension per neuron against in-degree dispersion; the solid line is the parameter-only conditional theory, the dashed and dotted lines average the conditional spectra or the gains before taking second moments. (b) The same on a logarithmic axis. (c) Ratio of each network&#x27;s dimension to the prediction. Dots are networks, markers are means with one across-network standard error. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_dynamics.png' alt='degree_dynamics'><figcaption><code>degree_dynamics.pdf</code><br>Alignment and chaos along the degree sweep. (a) Normalized E-I covariance energy (linear CKA of the two temporal Gram matrices) with its prediction. (b) Largest finite-time Lyapunov exponent of the midpoint map, six networks per dispersion, 2,000 leak times after burn-in. (c) Predicted spectral radius of the population response matrix; the averaging proposition assumes it is below one. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_factors.png' alt='degree_factors'><figcaption><code>degree_factors.pdf</code><br>Two routes to low dimension. D/N factors into a variance-heterogeneity term and a pair-correlation term (manuscript Eq. degreefactors). (a,b) Each factor against dispersion. (c) Both relative to their value at fixed in-degree; measured factors are normalized by the measured mean at zero dispersion. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_ingredients.png' alt='degree_ingredients'><figcaption><code>degree_ingredients.pdf</code><br>The ingredients of the dimension along the degree sweep. (a) Mean temporal rate variance of each population. (b) Covariance energies per network neuron; the E-I block is counted twice. (c) N times the mean squared covariance over distinct pairs. (d) Across-neuron variance of mean input, estimated across disjoint 500-time windows. (e) Temporal input variance. (f) Mean squared time-averaged gain. Lines are parameter-only predictions. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_network_scatter.png' alt='degree_network_scatter'><figcaption><code>degree_network_scatter.pdf</code><br>Network-by-network residuals along the degree sweep (360 networks; light to dark is dispersion 0 to 3). (a) Covariance energy against rate variance, each divided by its prediction; networks move along the dashed curve when amplitude changes without changing dimension. (b,c) Dimension residual against the residual of the E-E pair energy and of the E squared gain. N = 2,000.</figcaption></figure>
<figure><img src='degree_population_dimensions.png' alt='degree_population_dimensions'><figcaption><code>degree_population_dimensions.pdf</code><br>E-only, I-only and joint dimension per corresponding neuron along the degree sweep, on linear (a) and logarithmic (b) axes. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_ratios.png' alt='degree_ratios'><figcaption><code>degree_ratios.pdf</code><br>Measured-to-predicted ratios along the degree sweep. Each panel divides one network statistic by its parameter-only prediction at the same dispersion; the dashed line marks agreement. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_readout.png' alt='degree_readout'><figcaption><code>degree_readout.pdf</code><br>Fixed-size readouts along the degree sweep. (a) Participation ratio of 100 uniformly sampled E or I cells (mean of eight readouts per network). (b) Dimension of each whole population, 1,600 E and 400 I cells, with predictions. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_residual_partition.png' alt='degree_residual_partition'><figcaption><code>degree_residual_partition.pdf</code><br>Which covariance terms carry the dimension error. Each network&#x27;s log dimension error is partitioned exactly into a rate-variance term and the three block-energy terms (experiments/degree_residual). (a) Mean contribution of each term; squares give the total. (b) The E-E term split into distinct pairs and the same-neuron diagonal. Bars are one across-network standard error. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>
<figure><img src='degree_spread_and_sensitivity.png' alt='degree_spread_and_sensitivity'><figcaption><code>degree_spread_and_sensitivity.pdf</code><br>Network-to-network spread and recording sensitivity along the degree sweep. (a) Empirical distribution of D/N over 24 networks at each dispersion, divided by the prediction. (b) Coefficient of variation across networks. (c) Ratio of the dimension estimated from the first 4,000 leak times, or with one empty window between estimator windows, to the primary estimate. N = 2,000, 80:20 E:I, 24 networks per dispersion, 8,000 recorded leak times.</figcaption></figure>

<figure><img src='size_fold_change_and_spread.png' alt='size_fold_change_and_spread'><figcaption><code>size_fold_change_and_spread.pdf</code><br>(a) Ratio of mean dimension at fixed in-degree to that at dispersion 2, against network size; the line is the predicted 10.34-fold change and bars are delta-method standard errors. (b) Coefficient of variation of D/N across networks; the dashed line has slope -1/2. Networks per size: 48, 32, 24 (48 at 60:40), 12 and 6 for N = 500, 1,000, 2,000, 4,000 and 8,000, and 4 at N = 16,000 for dispersions 0, 1 and 2. Dots are networks; markers are across-network medians with a bootstrap standard error over fluctuating networks (medians, because at N = 500 a few weakly fluctuating networks have ill-conditioned ratios).</figcaption></figure>
<figure><img src='size_ingredients.png' alt='size_ingredients'><figcaption><code>size_ingredients.pdf</code><br>Finite-size residuals of population dimensions, distinct-pair energies, local input and gain statistics and E-I alignment, as relative errors of the across-network median against the prediction. Networks per size: 48, 32, 24 (48 at 60:40), 12 and 6 for N = 500, 1,000, 2,000, 4,000 and 8,000, and 4 at N = 16,000 for dispersions 0, 1 and 2. Dots are networks; markers are across-network medians with a bootstrap standard error over fluctuating networks (medians, because at N = 500 a few weakly fluctuating networks have ill-conditioned ratios).</figcaption></figure>

<h2>Local laws and temporal structure</h2>
<figure><img src='covariance_spectra.png' alt='covariance_spectra'><figcaption><code>covariance_spectra.pdf</code><br>Eigenvalue spectra of the whole-record rate covariance (ordinary centering, 8,000 leak times), normalized to unit mean and plotted against normalized rank; geometric mean over up to eight networks. (a) Degree dispersion at N = 2,000. (b) Excitatory fraction at N = 2,000. (c) Network size at dispersion 1, 80:20. These spectra include the finite-record noise floor and are shown for shape only; the manuscript&#x27;s dimension estimates use the cross-window estimator.</figcaption></figure>
<figure><img src='lag_maps_chi0.png' alt='lag_maps_chi0'><figcaption><code>lag_maps_chi0.pdf</code><br>Two-lag pair moments at \chi=0, N = 2,000 (8 networks). psi_ab(tau1,tau2) is N times the mean over distinct pairs (i in a, j in b) of C_ij(tau1) C_ij(tau2). Top: parameter-only prediction. Middle: mean of cross-fitted network estimates, in which the two covariance factors come from disjoint halves of the recording so that estimation noise does not multiply itself. Each column shares one symmetric color scale; dashed contours mark negative values. Bottom: equal-lag slice (colored) and tau2 = 0 slice (gray) with one across-network standard error. No amplitude or timescale is fitted.</figcaption></figure>
<figure><img src='lag_maps_chi1.png' alt='lag_maps_chi1'><figcaption><code>lag_maps_chi1.pdf</code><br>Two-lag pair moments at \chi=1, N = 2,000 (8 networks). psi_ab(tau1,tau2) is N times the mean over distinct pairs (i in a, j in b) of C_ij(tau1) C_ij(tau2). Top: parameter-only prediction. Middle: mean of cross-fitted network estimates, in which the two covariance factors come from disjoint halves of the recording so that estimation noise does not multiply itself. Each column shares one symmetric color scale; dashed contours mark negative values. Bottom: equal-lag slice (colored) and tau2 = 0 slice (gray) with one across-network standard error. No amplitude or timescale is fitted.</figcaption></figure>
<figure><img src='lag_maps_chi2.png' alt='lag_maps_chi2'><figcaption><code>lag_maps_chi2.pdf</code><br>Two-lag pair moments at \chi=2, N = 2,000 (8 networks). psi_ab(tau1,tau2) is N times the mean over distinct pairs (i in a, j in b) of C_ij(tau1) C_ij(tau2). Top: parameter-only prediction. Middle: mean of cross-fitted network estimates, in which the two covariance factors come from disjoint halves of the recording so that estimation noise does not multiply itself. Each column shares one symmetric color scale; dashed contours mark negative values. Bottom: equal-lag slice (colored) and tau2 = 0 slice (gray) with one across-network standard error. No amplitude or timescale is fitted.</figcaption></figure>
<figure><img src='lag_sources.png' alt='lag_sources'><figcaption><code>lag_sources.pdf</code><br>The same-neuron source of covariance energy at Bernoulli dispersion, N = 2,000. Q_a(tau1,tau2) is the mean over neurons of the product of a neuron&#x27;s own rate autocovariance at two lags, cross-fitted across recording halves. (a) Equal-lag slice and (b) tau2 = 0 slice, with predictions. (c) Predicted ratio of the source to the squared population-mean kernel; averaging spectra before taking the product replaces this ratio by one.</figcaption></figure>
<figure><img src='local_degree_and_inputs.png' alt='local_degree_and_inputs'><figcaption><code>local_degree_and_inputs.pdf</code><br>Where the operating points come from. Top: each neuron&#x27;s time-averaged input against its realized inhibitory in-degree (r_I and r_E are the correlations of mean input with inhibitory and excitatory in-degree). With fixed in-degree the remaining spread comes from sampling unequal presynaptic rates. Bottom: each neuron&#x27;s temporal input variance against its mean input; the closure assigns one temporal variance per population. Six networks pooled per dispersion, 3,000 neurons shown per population, N = 2,000.</figcaption></figure>
<figure><img src='local_laws.png' alt='local_laws'><figcaption><code>local_laws.pdf</code><br>The same operating point controls a neuron&#x27;s rate variance and gain. Columns: degree dispersion 0, 1 and 2 at N = 2,000 (12 networks pooled; E blue, I red). Top: distribution of time-averaged inputs with the predicted Gaussian (a vertical line at zero dispersion, where the leading theory has no static spread). Middle: each neuron&#x27;s temporal rate variance against its mean input (dots, 5,000 neurons per population), binned means (circles) and the conditional prediction v_a(z) (line). Bottom: the same for the time-averaged gain and alpha_a(z). At zero dispersion the diamond marks the single predicted point.</figcaption></figure>
<figure><img src='temporal_kernels.png' alt='temporal_kernels'><figcaption><code>temporal_kernels.pdf</code><br>Single-neuron temporal kernels against the one-site prediction. Top: autocovariance of the input (population-shared dynamic kernel K_a). Bottom: autocovariance of the rate, averaged over operating points. Lines are parameter-only; markers are means over networks (192 sampled neurons per population per network, whole-record centering) with one across-network standard error. Columns: degree dispersion 0, 1, 2 at the reference coupling, and coupling variance scaled by 3. N = 2,000.</figcaption></figure>
<h2>Recording protocol</h2>
<figure><img src='record_convergence.png' alt='record_convergence'><figcaption><code>record_convergence.pdf</code><br>Convergence of the estimators with recording length. Each network&#x27;s rate variance, covariance energy and dimension from a prefix of its recording, divided by the same network&#x27;s value at 32,000 leak times (window 500, no gap). Eight networks per setting, N = 2,000; bars are one across-network standard error.</figcaption></figure>
<figure><img src='record_duration_and_block.png' alt='record_duration_and_block'><figcaption><code>record_duration_and_block.pdf</code><br>Recording length and window length. Top: the four-window mean-difference estimate of D/N against the recorded duration used, for window lengths B = 500, 1,000 and 2,000 leak times; the dashed line is the prediction. Bottom: ratio of the separately centered estimate to the mean-difference estimate at the same duration and window length; the excess falls as the window lengthens, not as the recording lengthens. Eight networks per setting, N = 2,000; bars are one across-network standard error.</figcaption></figure>
<figure><img src='record_gap_and_step.png' alt='record_gap_and_step'><figcaption><code>record_gap_and_step.pdf</code><br>Sensitivity to an empty window between estimator windows and to the integration step. (a) Relative change of D/N when the four estimator windows must be separated by one empty window. (b,c) Relative change of D/N and of the mean rate variance when the same graph and initial condition are integrated with a step of 0.025 or 0.125 instead of 0.05 (8,000 leak times each); a different step produces a different chaotic trajectory, so individual networks scatter. Bars are two-sided 95% t intervals over eight networks; dots are networks.</figcaption></figure>
<h2>Other couplings and rates</h2>
<figure><img src='generality_coupling_and_rate.png' alt='generality_coupling_and_rate'><figcaption><code>generality_coupling_and_rate.pdf</code><br>The conditional prediction away from the reference parameters. Top: coupling variance profile scaled by s at fixed mean connectivity and target rate 0.3. Bottom: target mean rate changed at the reference coupling. Columns: joint dimension with the two premature-averaging approximations (hollow diamonds are medians); population dimensions; measured-to-predicted ratios of rate variance, covariance energy and dimension; largest finite-time Lyapunov exponent (six networks). At s = 0.5, close to the transition to chaos, D/N scatters widely around a small prediction and its ratio lies partly off scale. N = 2,000, 80:20, Bernoulli-like dispersion 1, 16 networks per setting (24 at the reference); one s = 0.5 network that settled to a fixed point is excluded.</figcaption></figure>

<figure><img src='check_lyapunov_all.png' alt='check_lyapunov_all'><figcaption><code>check_lyapunov_all.pdf</code><br>Largest finite-time Lyapunov exponent of all 280 networks where it was measured (one tangent vector, 2,000 leak times after burn-in), against (a) the predicted spectral radius of the population response matrix and (b) the measured temporal input variance of E cells; (c) dimension against the exponent. Colors mark the experiment family. One network at a fixed point has a negative exponent and three are zero within their block-to-block scatter (summary.json lists them); the rest are positive in every time block.</figcaption></figure>
<figure><img src='check_realized_degree_dispersion.png' alt='check_realized_degree_dispersion'><figcaption><code>check_realized_degree_dispersion.pdf</code><br>The degree sampler delivers the requested dispersion. (a) Variance of the realized in-degree in each of the four connectivity blocks, divided by the Bernoulli count variance, against the requested dispersion (mean over six networks; the dashed line is equality). (b) The difference, which at zero dispersion is the stochastic rounding of non-integer mean counts. N = 2,000.</figcaption></figure>
<figure><img src='check_spread_and_timing.png' alt='check_spread_and_timing'><figcaption><code>check_spread_and_timing.pdf</code><br>(a) Distribution of excitatory mean inputs at fixed in-degree, centered on the population mean, for each network size (four networks pooled per size); the leading theory predicts a point mass. (b) Simulation time per network on one core of the rented machines (8,000 leak times, step 0.05), with a quadratic guide. (c) Networks per experiment family.</figcaption></figure>
